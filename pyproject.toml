[project]
name = "mixtape"
version = "0.1.0b1"
description = "TUI that mirrors curated YouTube Music playlists onto USB MP3 players, with auto-detection and per-playlist audio format"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Fabrice Dossin", email = "fabrice.dossin@amoobi.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.12"
dependencies = [
    "textual>=0.86",
    "yt-dlp>=2025.1.15",
    "pyyaml>=6.0",
    "mutagen>=1.47",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "pystray>=0.19.5",
    "pillow>=12.2.0",
    # Daemon (FastAPI on local loopback) + clients (httpx for REST,
    # websockets for the event stream).
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.9",
]

# Optional desktop UI (Qt via PySide6). Heavyweight (~60MB), skip on
# RPi/headless. Install with: uv sync --extra desktop
[project.optional-dependencies]
desktop = [
    "PySide6>=6.7",
    "qasync>=0.27",
]

[project.scripts]
mixtape = "mixtape.app:main"
mixtape-daemon = "mixtape.daemon.main:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
yt-dlp = { git = "https://github.com/yt-dlp/yt-dlp.git", rev = "master" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
